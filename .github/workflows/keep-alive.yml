name: Supabase Keep-Alive

# Hits the Trillioneuro database once a day so Supabase never marks it
# inactive. Free-tier projects pause after 7 days with no DB activity;
# a daily read resets that timer with a huge buffer.

on:
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC daily
  workflow_dispatch:        # lets you run it manually from the Actions tab

defaults:
  run:
    # Git Bash: the steps are bash, and plain 'bash' on Windows can resolve to WSL
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}

jobs:
  ping:
    runs-on: [self-hosted, minipc]
    steps:
      - name: Query founders_public to keep DB awake
        run: |
          SUPABASE_URL="https://kxzywyflylkcqoidiqmo.supabase.co"
          ANON_KEY="sb_publishable_37yXvakYMXdpz2e3Hf_zng__oGOVC-g"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/founders_public?select=founder_number&limit=1")
          echo "HTTP ${code}"
          if [ "$code" -ge 400 ]; then
            echo "Keep-alive request failed"; exit 1
          fi
          echo "Database pinged successfully — inactivity timer reset."
